name: R77 Salesbond security foundation
on:
  push:
    branches: [integration/r77-salesbond-evoq]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run build:icons
      - run: npm run test:security
      - run: npm run typecheck
      - run: npm run build
# Fixture browser and real Frappe acceptance are separate required release gates.
# This workflow never deploys or modifies production.
